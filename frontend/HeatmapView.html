<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Heatmap</title>
  <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial; margin: 0; }
    .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
    .grid { display: grid; gap: 16px; }
    @media (min-width: 1024px) { .lg\:grid-cols-4 { grid-template-columns: 1fr 3fr; } }
    .card { border: 1px solid #e5e7eb; border-radius: 8px; background: white; }
    .card-header { padding: 12px 16px; border-bottom: 1px solid #f3f4f6; }
    .card-content { padding: 16px; }
    .muted { color:#6b7280; }
    .control { margin-bottom:12px; }
  </style>  
</head>
<body>
  <div class="container">
    <h1>Heatmap Visning</h1>
    <p class="muted">Visualisering af WiFi-dækning med farveskala</p>

    <div class="grid lg:grid-cols-4" style="display:flex; gap:16px;">
      <div style="width:280px;">
        <div class="card" style="margin-bottom:12px;"><div class="card-header"><strong>Filtre</strong></div>
          <div class="card-content">
            <div class="control" id="apSelectWrap">
              <label>Vælg AP</label>
              <div id="apList" style="margin-top:6px; max-height:180px; overflow:auto; border:1px solid #eee; padding:8px; border-radius:4px;"></div>
            </div>
            <div class="control"><label>Radius: <span id="radiusVal">80</span>px</label><input id="radius" type="range" min="20" max="200" step="10" value="80" style="width:100%;" /></div>
            <div class="control"><label>Gennemsigtighed: <span id="opacityVal">70</span>%</label><input id="opacity" type="range" min="10" max="100" step="5" value="70" style="width:100%;" /></div>
            <div class="control"><label>Vis kun signalstyrker mellem <span id="minVal">-90</span> dBm og <span id="maxVal">-30</span> dBm</label>
              <div style="display:flex; gap:8px; margin-top:8px;">
                <input id="minRssi" type="range" min="-100" max="0" step="0.5" value="-90" style="flex:1;" />
                <input id="maxRssi" type="range" min="-100" max="0" step="0.5" value="-30" style="flex:1;" />
              </div>
            </div>
          </div>
        </div>

        <div class="card"><div class="card-header"><strong>Signalstyrke</strong></div><div class="card-content"><div>-35 til -50 dBm: Fremragende</div><div>-51 til -70 dBm: God</div><div>-71 til -85 dBm: Svag</div></div></div>
      </div>

      <div style="flex:1;">
        <div class="card"><div class="card-header"><strong>Heatmap</strong></div>
          <div class="card-content">
            <div id="canvasWrap" style="border-radius:6px; overflow:hidden; border:1px solid #e6e6e6;">
              <canvas id="heatCanvas" style="display:block;"></canvas>
            </div>
          </div>
        </div>
      </div>

      <div style="width:420px;">
        <div class="card"><div class="card-header"><strong>Målinger</strong></div>
          <div class="card-content" style="max-height:520px; overflow:auto;">
            <div id="readingList" style="font-size:14px; line-height:1.4;">
              Ingen målinger endnu
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function(){
      let floorPlan = null;
      let measurements = [];
      let cachedDisplayWidth = null;
      let cachedDisplayHeight = null;
      const canvas = document.getElementById('heatCanvas');
      const apList = document.getElementById('apList');
  const apSelectWrap = document.getElementById('apSelectWrap');
  const selectedAPs = new Set();
  const readingListEl = document.getElementById('readingList');
  let highlightedMeasurementId = null;
      const radiusInput = document.getElementById('radius');
  const opacityInput = document.getElementById('opacity');
  const radiusVal = document.getElementById('radiusVal');
  const opacityVal = document.getElementById('opacityVal');
  const minRssi = document.getElementById('minRssi');
  const maxRssi = document.getElementById('maxRssi');
  const minVal = document.getElementById('minVal');
  const maxVal = document.getElementById('maxVal');

      function getAccessPoints() {
        // Build a deduplicated list of access points keyed by SSID when available,
        // otherwise fall back to BSSID. We return a representative bssid for each ssid.
        const map = new Map();
        measurements.forEach(m => {
          const b = m.bssid || (m.readings && m.readings[0] && (m.readings[0].bssid || m.readings[0].mac)) || null;
          const s = (m.ssid || (m.readings && m.readings[0] && m.readings[0].ssid) || '').trim();
          const key = s || b || null;
          if (!key) return;
          if (!map.has(key)) {
            map.set(key, { key, ssid: s || null, bssid: b || null, count: 1 });
          } else {
            const entry = map.get(key);
            entry.count = (entry.count || 0) + 1;
          }
        });
        return Array.from(map.values());
      }

      function getColorForSignal(strength) {
        const normalized = Math.max(0, Math.min(1, (strength + 85) / 50));
        if (normalized < 0.5) {
          const factor = normalized * 2;
          return `rgba(255, ${Math.floor(255 * factor)}, 0, 1)`;
        } else {
          const factor = (normalized - 0.5) * 2;
          return `rgba(${Math.floor(255 * (1 - factor))}, 255, 0, 1)`;
        }
      }

  function draw() {
        if (!floorPlan) {
          canvas.width = 800; canvas.height = 400; const ctx=canvas.getContext('2d'); ctx.clearRect(0,0,canvas.width,canvas.height); ctx.fillStyle='#f8fafc'; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.fillStyle='#9ca3af'; ctx.fillText('Upload en plantegning og tilføj målepunkter først',20,20); return; }
        const ctx = canvas.getContext('2d');
        const img = new Image();
        img.onload = () => {
          // Use natural image dimensions to ensure consistency
          const originalWidth = floorPlan.width || img.naturalWidth;
          const originalHeight = floorPlan.height || img.naturalHeight;
          
          // Calculate display dimensions only once, then cache them
          if (cachedDisplayWidth === null || cachedDisplayHeight === null) {
            const canvasWrap = document.getElementById('canvasWrap');
            const containerWidth = canvasWrap.offsetWidth;
            const scale = containerWidth / originalWidth;
            cachedDisplayWidth = containerWidth;
            cachedDisplayHeight = originalHeight * scale;
          }
          
          const displayWidth = cachedDisplayWidth;
          const displayHeight = cachedDisplayHeight;
          
          // Set canvas to display size (not original size)
          canvas.width = displayWidth;
          canvas.height = displayHeight;
          
          ctx.drawImage(img, 0, 0, displayWidth, displayHeight);
          // RSSI filtering bounds (min <= signal <= max)
          const minFilter = parseFloat(minRssi.value);
          const maxFilter = parseFloat(maxRssi.value);

          // Helper to compute the same key used by the AP list (SSID or BSSID)
          const getKeyForMeasurement = (m) => {
            const b = m.bssid || (m.readings && m.readings[0] && (m.readings[0].bssid || m.readings[0].mac)) || null;
            const s = (m.ssid || (m.readings && m.readings[0] && m.readings[0].ssid) || '').trim();
            return s || b || null;
          };

          // Build base set filtered by selected checkboxes in the UI (read live)
          const checkedInputs = Array.from(apList.querySelectorAll('input[type=checkbox][data-key]'))
            .filter(i => i.checked)
            .map(i => i.dataset.key);
          const uiSet = new Set(checkedInputs);
          const base = measurements.filter(m => {
            const key = getKeyForMeasurement(m);
            return key && uiSet.has(key);
          });

          const filtered = base.filter(m => {
            const sig = (typeof m.signalStrength === 'number') ? m.signalStrength : (typeof m.rssi === 'number' ? m.rssi : (m.readings && m.readings[0] && (m.readings[0].rssi || m.readings[0].signal_level)) || null);
            if (sig === null) return false;
            return sig >= minFilter && sig <= maxFilter;
          });
          
          // Create heatmap using density-based approach with signal strength weighting
          // Step 1: Create off-screen canvas for accumulation
          const heatCanvas = document.createElement('canvas');
          heatCanvas.width = displayWidth;
          heatCanvas.height = displayHeight;
          const heatCtx = heatCanvas.getContext('2d');
          
          // Step 2: Accumulate signal influence from each measurement point
          const rad = parseInt(radiusInput.value,10);
          
          filtered.forEach(m => {
            const displayX = (m.x / originalWidth) * displayWidth;
            const displayY = (m.y / originalHeight) * displayHeight;
            const sig = (typeof m.signalStrength === 'number') ? m.signalStrength : (typeof m.rssi === 'number' ? m.rssi : (m.readings && m.readings[0] && (m.readings[0].rssi || m.readings[0].signal_level)) || null);
            
            // Normalize signal strength to 0-1 range
            // -30 dBm = excellent (1.0), -90 dBm = poor (0.0)
            const signalNormalized = Math.max(0, Math.min(1, (sig + 90) / 60));
            
            // Create radial gradient for this measurement
            const grad = heatCtx.createRadialGradient(displayX, displayY, 0, displayX, displayY, rad);
            
            // Map signal strength to colors with higher saturation and contrast:
            // Strong signal (>0.7): Bright Green
            // Medium signal (0.4-0.7): Bright Yellow/Orange
            // Weak signal (<0.4): Bright Red
            let centerColor, edgeColor;
            
            if (signalNormalized > 0.7) {
              // Strong signal - vibrant green gradient with full opacity
              centerColor = `rgba(16, 185, 129, 1)`;
              edgeColor = `rgba(16, 185, 129, 0)`;
            } else if (signalNormalized > 0.4) {
              // Medium signal - vibrant yellow/orange gradient with full opacity
              centerColor = `rgba(245, 158, 11, 1)`;
              edgeColor = `rgba(245, 158, 11, 0)`;
            } else {
              // Weak signal - vibrant red gradient with high opacity
              centerColor = `rgba(220, 38, 38, 0.95)`;
              edgeColor = `rgba(220, 38, 38, 0)`;
            }
            
            grad.addColorStop(0, centerColor);
            grad.addColorStop(1, edgeColor);
            
            heatCtx.fillStyle = grad;
            heatCtx.fillRect(displayX - rad, displayY - rad, rad*2, rad*2);
          });
          
          // Step 3: Apply accumulated heatmap with stronger visibility
          ctx.save();
          ctx.globalAlpha = parseFloat(opacityInput.value)/100;
          ctx.globalCompositeOperation = 'source-over';
          ctx.drawImage(heatCanvas, 0, 0);
          ctx.restore();
          
          ctx.globalAlpha = 1;
          filtered.forEach(m => { 
            const displayX = (m.x / originalWidth) * displayWidth;
            const displayY = (m.y / originalHeight) * displayHeight;
            
            // Draw highlight ring if this measurement is highlighted
            if (highlightedMeasurementId !== null && m.id === highlightedMeasurementId) {
              ctx.beginPath();
              ctx.arc(displayX, displayY, 16, 0, Math.PI*2);
              ctx.strokeStyle = 'rgba(30, 58, 138, 0.9)';
              ctx.lineWidth = 3;
              ctx.stroke();
              
              ctx.beginPath();
              ctx.arc(displayX, displayY, 20, 0, Math.PI*2);
              ctx.strokeStyle = 'rgba(30, 58, 138, 0.45)';
              ctx.lineWidth = 2;
              ctx.stroke();
            }
            
            ctx.beginPath(); 
            ctx.arc(displayX, displayY, 4, 0, Math.PI*2); 
            ctx.fillStyle='white'; 
            ctx.fill(); 
            ctx.strokeStyle='rgba(0,0,0,0.5)'; 
            ctx.lineWidth=2; 
            ctx.stroke(); 
          });

          // Update right-side readings list from the same filtered array
          if (readingListEl) {
            readingListEl.innerHTML = '';
            if (!filtered || filtered.length === 0) {
              readingListEl.textContent = 'Ingen målinger matcher filtrene';
            } else {
              filtered.forEach(m => {
                const sig = (typeof m.signalStrength === 'number') ? m.signalStrength : (m.readings && m.readings[0] && (m.readings[0].rssi || m.readings[0].signal_level)) || null;
                const ssid = m.ssid || (m.readings && m.readings[0] && m.readings[0].ssid) || '';
                const bssid = m.bssid || (m.readings && m.readings[0] && (m.readings[0].bssid || m.readings[0].mac)) || '';
                const freq = (m.frequency || (m.readings && m.readings[0] && m.readings[0].frequency)) || null;
                const channel = (m.channel || (m.readings && m.readings[0] && m.readings[0].channel)) || null;
                const ts = m.timestamp ? (new Date(m.timestamp)).toLocaleString() : (m.createdAt ? (new Date(m.createdAt)).toLocaleString() : '');
                
                // Debug: log one measurement to see actual data structure
                if (window.debugMeasurement !== true) {
                  console.log('Sample measurement data:', m);
                  window.debugMeasurement = true;
                }

                const row = document.createElement('div');
                row.style.padding = '10px';
                row.style.borderBottom = '1px solid #f3f4f6';
                row.style.display = 'flex';
                row.style.gap = '10px';
                row.style.alignItems = 'center';

                // Color dot based on signal
                const dot = document.createElement('div');
                dot.style.width = '14px';
                dot.style.height = '14px';
                dot.style.borderRadius = '50%';
                dot.style.flex = '0 0 14px';
                const color = (typeof getColorForSignal === 'function' && sig !== null) ? getColorForSignal(sig) : 'rgba(156,163,175,1)';
                dot.style.background = color;
                dot.style.boxShadow = '0 0 4px rgba(0,0,0,0.08)';

                const content = document.createElement('div');
                content.style.flex = '1 1 auto';

                const title = document.createElement('div');
                title.style.fontWeight = '700';
                title.style.marginBottom = '3px';
                title.textContent = ssid || bssid || ('MP ' + (m.id || '?'));

                const details = document.createElement('div');
                details.style.fontSize = '12px';
                details.style.color = '#6b7280';
                details.style.display = 'flex';
                details.style.flexWrap = 'wrap';
                details.style.gap = '8px';

                const idBadge = document.createElement('span');
                idBadge.textContent = `MP #${m.id || '?'}`;
                idBadge.style.background = 'rgba(34, 197, 94, 0.15)';
                idBadge.style.color = 'rgba(21, 128, 61, 1)';
                idBadge.style.padding = '2px 6px';
                idBadge.style.borderRadius = '999px';
                idBadge.style.fontSize = '11px';

                const parentBadge = document.createElement('span');
                if (m.parentId) {
                  parentBadge.textContent = `parent #${m.parentId}`;
                  parentBadge.style.background = '#fff7ed';
                  parentBadge.style.color = '#92400e';
                  parentBadge.style.padding = '2px 6px';
                  parentBadge.style.borderRadius = '999px';
                  parentBadge.style.fontSize = '11px';
                }

                const rssiSpan = document.createElement('span');
                rssiSpan.textContent = `RSSI: ${sig !== null ? sig + ' dBm' : 'N/A'}`;

                const coordSpan = document.createElement('span');
                coordSpan.textContent = `x:${Math.round(m.x)}, y:${Math.round(m.y)}`;

                const bssidSpan = document.createElement('span');
                bssidSpan.textContent = bssid ? `${bssid}` : '';
                bssidSpan.style.opacity = bssid ? '1' : '0.6';
                bssidSpan.style.fontSize = '12px';

                const freqSpan = document.createElement('span');
                if (freq) {
                  const freqGHz = freq >= 5000 ? `${(freq/1000).toFixed(1)} GHz` : `${(freq/1000).toFixed(1)} GHz`;
                  freqSpan.textContent = freqGHz;
                }

                const channelSpan = document.createElement('span');
                if (channel) channelSpan.textContent = `Ch ${channel}`;

                const tsSpan = document.createElement('span');
                tsSpan.textContent = ts;
                tsSpan.style.marginLeft = 'auto';
                tsSpan.style.fontSize = '11px';
                tsSpan.style.color = '#9ca3af';

                // Compose details
                details.appendChild(idBadge);
                if (m.parentId) details.appendChild(parentBadge);
                details.appendChild(rssiSpan);
                details.appendChild(coordSpan);
                if (freq) details.appendChild(freqSpan);
                if (channel) details.appendChild(channelSpan);
                if (bssid) details.appendChild(bssidSpan);

                content.appendChild(title);
                content.appendChild(details);

                row.appendChild(dot);
                row.appendChild(content);
                row.appendChild(tsSpan);

                // Hover and click affordances
                row.addEventListener('mouseenter', () => { 
                  row.style.background = '#f8fafc'; 
                  highlightedMeasurementId = m.id;
                  draw();
                });
                row.addEventListener('mouseleave', () => { 
                  row.style.background = 'transparent'; 
                  highlightedMeasurementId = null;
                  draw();
                });
                row.style.cursor = 'pointer';
                row.addEventListener('click', () => {
                  // Toggle highlight on click for persistent selection
                  if (highlightedMeasurementId === m.id) {
                    highlightedMeasurementId = null;
                  } else {
                    highlightedMeasurementId = m.id;
                  }
                  draw();
                  // Post a message so parent app or other iframes can react
                  if (window.parent && window.parent.postMessage) {
                    window.parent.postMessage({ type: 'heatmap:selectMeasurement', measurementId: m.id }, '*');
                  }
                });

                readingListEl.appendChild(row);
              });
            }
          }
        };
        img.src = floorPlan.imageUrl;
      }

      function rebuildAPList() {
        const aps = getAccessPoints();
        apList.innerHTML = '';
        selectedAPs.clear();
        if (!aps || aps.length === 0) {
          apList.textContent = 'Ingen adgangspunkter fundet';
          return;
        }

        // Map to keep input references by BSSID
        const inputsByBssid = new Map();

        // Select all checkbox
        const allLabel = document.createElement('label');
        allLabel.style.display = 'block';
        allLabel.style.marginBottom = '8px';
        const allInput = document.createElement('input');
  allInput.type = 'checkbox';
  allInput.checked = true;
        allInput.style.marginRight = '6px';
        allLabel.appendChild(allInput);
        allLabel.appendChild(document.createTextNode('Vælg alle'));
        apList.appendChild(allLabel);

        allInput.addEventListener('change', () => {
          const checked = allInput.checked;
          inputsByBssid.forEach((inp, b) => {
            inp.checked = checked;
            if (checked) selectedAPs.add(b); else selectedAPs.delete(b);
          });
          draw();
        });

        aps.forEach(ap => {
          const label = document.createElement('label');
          label.style.display = 'block';
          label.style.marginBottom = '6px';
          const input = document.createElement('input');
          input.type = 'checkbox';
          // Use the dedupe key (SSID or BSSID) as dataset key
          input.dataset.key = ap.key;
          input.checked = true;
          input.style.marginRight = '6px';
          label.appendChild(input);
          const labelText = ap.ssid ? `${ap.ssid} (${(ap.bssid||'').slice(0,8)})` : (ap.bssid || ap.key);
          label.appendChild(document.createTextNode(labelText + (ap.count && ap.count>1 ? ` — ${ap.count}` : '')));
          apList.appendChild(label);
          inputsByBssid.set(ap.key, input);
          selectedAPs.add(ap.key);

          input.addEventListener('change', () => {
            if (input.checked) selectedAPs.add(ap.key); else selectedAPs.delete(ap.key);
            // update allInput checked state
            const allChecked = Array.from(inputsByBssid.values()).every(i => i.checked);
            allInput.checked = allChecked;
            draw();
          });
        });
      }

      radiusInput.addEventListener('input', ()=>{ radiusVal.textContent=radiusInput.value; draw(); });
      opacityInput.addEventListener('input', ()=>{ opacityVal.textContent=opacityInput.value; draw(); });
  minRssi.addEventListener('input', ()=>{ minVal.textContent = minRssi.value; draw(); });
  maxRssi.addEventListener('input', ()=>{ maxVal.textContent = maxRssi.value; draw(); });

      window.addEventListener('message', function(ev){
        try {
          const msg = ev.data || {};
          if (msg.type === 'heatmap:set') {
            measurements = Array.isArray(msg.measurements) ? msg.measurements : [];
            rebuildAPList(); draw();
          }
          if (msg.type === 'heatmap:setFloorPlan') {
            floorPlan = msg.floorPlan || null; 
            // Reset cached dimensions when new floor plan is loaded
            cachedDisplayWidth = null;
            cachedDisplayHeight = null;
            draw();
          }
        } catch (err) {}
      }, false);

      if (window.parent && typeof window.parent.postMessage === 'function') {
        window.parent.postMessage({ type: 'heatmap:ready' }, '*');
      }

    })();
  </script>
</body>
</html>
